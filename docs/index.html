<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Iran Prosperity RAG</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; }
      textarea { width: 100%; height: 90px; }
      button { margin-top: 10px; padding: 10px 14px; }
      pre { background: #f6f6f6; padding: 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Iran Prosperity RAG</h1>

    <label>Question</label>
    <textarea id="q" placeholder="Ask a question..."></textarea>
    <button id="ask">Ask</button>

    <h3>Answer</h3>
    <pre id="out"></pre>

    <script>
      const API_URL = "https://iran-prosperity-rag.mohammadmehdiomidi95.workers.dev/api/chat";

      document.getElementById("ask").onclick = async () => {
        const question = document.getElementById("q").value.trim();
        if (!question) return;

        document.getElementById("out").textContent = "Loading...";

        const r = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });

        const data = await r.json();
        document.getElementById("out").textContent = data.answer || JSON.stringify(data, null, 2);
      };
    </script>
  </body>
</html>
