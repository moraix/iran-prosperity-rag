<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Iran Prosperity RAG</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">  
  </head>
  <body>

    <div class="container">
      <div class="logo-wrapper">
        <img src="IPP-Logo.png" alt="Logo" class="logo">
      </div>      
      <div class="card">
        <h1 class="title">Iran Prosperity Project</h1>
    
        <div class="field">
          <label for="q">Question</label>
          <textarea id="q" placeholder="Ask a question..."></textarea>
        </div>
    
        <button id="ask">Ask</button>
    
        <div class="answer-section">
          <h3>Answer</h3>
          <pre id="out"></pre>
        </div>
      </div>
    </div>    
    <script>
      const API_URL = "https://iran-prosperity-rag.mohammadmehdiomidi95.workers.dev/api/chat";

      document.getElementById("ask").onclick = async () => {
        const question = document.getElementById("q").value.trim();
        if (!question) return;

        document.getElementById("out").textContent = "Loading...";

        const r = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });

        const data = await r.json();
        document.getElementById("out").textContent = data.answer || JSON.stringify(data, null, 2);
      };
    </script>
  </body>
</html>
